[project]
name = "pvtool"
description = "This tool contains validation logic for the BO4E migration data model (ibims). It uses the pvframework. "
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["python", "validation", "migration", "bo4e"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bomf",
    "ibims>=0.3.6",
    "more_itertools",
    "pydantic[email]",
    "pvframework>=0.0.8",
    "python-dateutil",
    "pytz",
    "schwifty"
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0"
]
coverage = [
    "coverage==7.15.2",
    {include-group = "tests"}
]
formatting = [
    "black==25.1.0",
    "isort==6.0.1"
]
linting = [
    "pylint==4.0.6",
    {include-group = "tests"}
]
spellcheck = [
    "codespell==2.4.3"
]
type-check = [
    "mypy==1.17.1",
    "types-python-dateutil==2.9.0.20250822",
    "types-pytz==2026.3.1.20260727",
    {include-group = "tests"}
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type-check"},
    {include-group = "coverage"},
    {include-group = "formatting"},
    "pre-commit"
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/pedantic-validator-tool/releases"
Homepage = "https://github.com/Hochfrequenz/pedantic-validator-tool"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120
disable="too-few-public-methods"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_your_package_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
