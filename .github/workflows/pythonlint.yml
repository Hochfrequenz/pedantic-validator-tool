name: "Linting"

on: [push]
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
        linter-env: ["linting", "type_check"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.linter-env }}
      - name: Run ruff
        if: matrix.linter-env == 'linting'
        run: |
          uv run ruff check src/pvtool
          uv run ruff check unittests
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: |
          uv run mypy --show-error-codes src/pvtool
          uv run mypy --show-error-codes unittests
