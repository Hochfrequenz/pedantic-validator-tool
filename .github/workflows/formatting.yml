name: "Formatting"

on: [push]
jobs:
  black:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
        tool: ["black", "isort"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group linting
      # matrix.tool values ("black", "isort") are kept as-is to preserve the required status check
      # names "black (..., black)" / "black (..., isort)"; both now run ruff under the hood.
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          if [ "${{ matrix.tool }}" = "black" ]; then
            uv run ruff format --check .
          else
            uv run ruff check --select I .
          fi
